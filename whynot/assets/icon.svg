<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Escuro com Brilho Radial Original -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1e1b2e" />
      <stop offset="60%" stop-color="#111017" />
      <stop offset="100%" stop-color="#08080b" />
    </radialGradient>

    <!-- Degradê Dourado Premium Original -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Degradê Dourado Claro (Facetas Iluminadas) Original -->
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Degradê Verde Esmeralda Original -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- Sombra e Brilho Central Original -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Fundo Squircle (Fundo Escuro Original com curvatura rx=128 para ícone de App) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="508" height="508" rx="126" fill="none" stroke="#262438" stroke-width="3" stroke-opacity="0.5" />

  <!-- AURA DE BRILHO CENTRAL ORIGINAL (Verde Esmeralda) -->
  <circle cx="256" cy="256" r="220" fill="#10b981" opacity="0.18" filter="url(#glow)" />

  <!-- ONDAS DE RADAR / SENSOR DE NOTIFICAÇÕES (Em Esmeralda Sutil) -->
  <path d="M 68,220 C 52,244 52,268 68,292" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" opacity="0.4" stroke-dasharray="2 4" />
  <path d="M 444,220 C 460,244 460,268 444,292" fill="none" stroke="#10b981" stroke-width="7" stroke-linecap="round" opacity="0.4" stroke-dasharray="2 4" />

  <!-- ESTRELA ORIGINAL DE 6 PONTAS FACETADA (3D) CENTRALIZADA -->
  <g transform="translate(256, 256) scale(2.45)" filter="url(#shadow)">
    <!-- Ponta 1: Superior (Norte) -->
    <polygon points="0,0 0,-85 -18,-31.18" fill="url(#goldLightGrad)" />
    <polygon points="0,0 0,-85 18,-31.18" fill="url(#goldGrad)" />

    <!-- Ponta 2: Superior Direita -->
    <polygon points="0,0 73.61,-42.5 18,-31.18" fill="url(#greenGrad)" />
    <polygon points="0,0 73.61,-42.5 36,0" fill="#059669" />

    <!-- Ponta 3: Inferior Direita -->
    <polygon points="0,0 73.61,42.5 36,0" fill="url(#goldLightGrad)" />
    <polygon points="0,0 73.61,42.5 18,31.18" fill="url(#goldGrad)" />

    <!-- Ponta 4: Inferior (Sul) -->
    <polygon points="0,0 0,85 18,31.18" fill="url(#greenGrad)" />
    <polygon points="0,0 0,85 -18,31.18" fill="#047857" />

    <!-- Ponta 5: Inferior Esquerda -->
    <polygon points="0,0 -73.61,42.5 -18,31.18" fill="url(#goldLightGrad)" />
    <polygon points="0,0 -73.61,42.5 -36,0" fill="url(#goldGrad)" />

    <!-- Ponta 6: Superior Esquerda -->
    <polygon points="0,0 -73.61,-42.5 -36,0" fill="url(#greenGrad)" />
    <polygon points="0,0 -73.61,-42.5 -18,-31.18" fill="#059669" />

    <!-- Núcleo Central Hexagonal (+50% aumentado) -->
    <polygon points="0,-46.77 40.5,-23.39 40.5,23.39 0,46.77 -40.5,23.39 -40.5,-23.39" 
             fill="#0a0a0e" 
             stroke="url(#goldGrad)" 
             stroke-width="3.5" />

    <!-- Emblema de Identidade WhyNot ("W" em Dourado Iluminado ampliado) -->
    <path d="M -22.5,-15 
             L -12,16.5 
             L 0,-1.5 
             L 12,16.5 
             L 22.5,-15" 
          fill="none" 
          stroke="url(#goldLightGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ponto Indicador de Notificação Ativa (Esmeralda) -->
    <circle cx="0" cy="28.5" r="5" fill="#34d399" />
  </g>
</svg>
