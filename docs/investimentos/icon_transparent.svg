<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Fundo Dark Mode com Brilho Radial em tons Quentes / Âmbar Profundo / Obsidiana -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#231a0e" />
      <stop offset="60%" stop-color="#120e07" />
      <stop offset="100%" stop-color="#080603" />
    </radialGradient>

    <!-- Degradê Amarelo Dourado Vibrante (Facetas Principais) -->
    <linearGradient id="goldVibrantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Degradê Amarelo Claro / Reflexo de Luz (Facetas Iluminadas) -->
    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Degradê Dourado Âmbar Profundo (Facetas de Contraste e Volume 3D) -->
    <linearGradient id="goldDeepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Degradê de Borda / Moldura Exterior do Núcleo -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Sombra e Brilho Central -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  
    <!-- Gradientes Lapidados do Cristal Central (Topázio Imperial / Ouro Lapidado) -->
    <linearGradient id="c_nw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>
    <linearGradient id="c_ne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <linearGradient id="c_e" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="c_se" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="c_s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <linearGradient id="c_w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
  </defs>

  <!-- Fundo Squircle (Fundo Dark Mode com curvatura rx=128 para ícone de App) -->
  
  

  <!-- AURA DE BRILHO CENTRAL (Amarelo & Dourado Vibrante) -->
  <circle cx="256" cy="256" r="220" fill="#eab308" opacity="0.20" filter="url(#glow)" />
  <circle cx="256" cy="256" r="140" fill="#facc15" opacity="0.16" filter="url(#glow)" />

  <!-- ONDAS DE RADAR / SENSOR DE NOTIFICAÇÕES (Amarelo Dourado Luminoso) -->
  <path d="M 68,220 C 52,244 52,268 68,292" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 4" />
  <path d="M 444,220 C 460,244 460,268 444,292" fill="none" stroke="#facc15" stroke-width="7" stroke-linecap="round" opacity="0.5" stroke-dasharray="2 4" />

  <!-- ESTRELA DE 6 PONTAS FACETADA (3D) CENTRALIZADA EM TONS DE AMARELO E AMARELO DOURADO -->
  <g transform="translate(256, 256) scale(2.45)" filter="url(#shadow)">
    <!-- Ponta 1: Superior (Norte) -->
    <polygon points="0,0 0,-85 -18,-31.18" fill="url(#goldLightGrad)" />
    <polygon points="0,0 0,-85 18,-31.18" fill="url(#goldVibrantGrad)" />

    <!-- Ponta 2: Superior Direita -->
    <polygon points="0,0 73.61,-42.5 18,-31.18" fill="url(#goldDeepGrad)" />
    <polygon points="0,0 73.61,-42.5 36,0" fill="#92400e" />

    <!-- Ponta 3: Inferior Direita -->
    <polygon points="0,0 73.61,42.5 36,0" fill="url(#goldLightGrad)" />
    <polygon points="0,0 73.61,42.5 18,31.18" fill="url(#goldVibrantGrad)" />

    <!-- Ponta 4: Inferior (Sul) -->
    <polygon points="0,0 0,85 18,31.18" fill="url(#goldDeepGrad)" />
    <polygon points="0,0 0,85 -18,31.18" fill="#78350f" />

    <!-- Ponta 5: Inferior Esquerda -->
    <polygon points="0,0 -73.61,42.5 -18,31.18" fill="url(#goldLightGrad)" />
    <polygon points="0,0 -73.61,42.5 -36,0" fill="url(#goldVibrantGrad)" />

    <!-- Ponta 6: Superior Esquerda -->
    <polygon points="0,0 -73.61,-42.5 -36,0" fill="url(#goldDeepGrad)" />
    <polygon points="0,0 -73.61,-42.5 -18,-31.18" fill="#92400e" />

    <!-- Núcleo Central Hexagonal Facetado 3D (Cristal Lapidado de Topázio / Ouro) -->
    <g>
      <!-- Base -->
      <polygon points="0,-46.77 40.5,-23.39 40.5,23.39 0,46.77 -40.5,23.39 -40.5,-23.39" 
               fill="#a16207" />
      <!-- Facetas Lapidadas -->
      <polygon points="0,0 -40.5,-23.39 0,-46.77" fill="url(#c_nw)" />
      <polygon points="0,0 0,-46.77 40.5,-23.39" fill="url(#c_ne)" />
      <polygon points="0,0 40.5,-23.39 40.5,23.39" fill="url(#c_e)" />
      <polygon points="0,0 40.5,23.39 0,46.77" fill="url(#c_se)" />
      <polygon points="0,0 0,46.77 -40.5,23.39" fill="url(#c_s)" />
      <polygon points="0,0 -40.5,23.39 -40.5,-23.39" fill="url(#c_w)" />
      <!-- Moldura Exterior com a cor mais escura do triângulo amarelo inferior esquerdo (#a16207) -->
      <polygon points="0,-46.77 40.5,-23.39 40.5,23.39 0,46.77 -40.5,23.39 -40.5,-23.39" 
               fill="none" 
               stroke="#a16207" 
               stroke-width="3.5" />
    </g>

  </g>
</svg>
